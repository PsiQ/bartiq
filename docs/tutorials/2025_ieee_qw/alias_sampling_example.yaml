program:
  children:
  - input_params:
    - L
    local_variables:
      R: ceiling(log2(L))
    name: usp
    ports:
    - direction: input
      name: in
      size: R
    - direction: output
      name: out
      size: R
    resources:
    - name: T_gates
      type: additive
      value: 8*(ceiling(log2(L/(2 ** multiplicity(2,L))))-1)
    - name: rotations
      type: additive
      value: '2'
    type: null
  - name: had
    ports:
    - direction: input
      name: in
      size: N
    - direction: output
      name: out
      size: N
    type: null
  - input_params:
    - L
    - mu
    local_variables:
      R: ceiling(log2(L))
    name: qrom
    ports:
    - direction: input
      name: In_alt
      size: R
    - direction: input
      name: In_keep
      size: mu
    - direction: input
      name: In_l
      size: R
    - direction: output
      name: out_alt
      size: R
    - direction: output
      name: out_keep
      size: mu
    - direction: output
      name: out_l
      size: R
    resources:
    - name: T_gates
      type: additive
      value: 4*L-4
    type: null
  - input_params:
    - mu
    name: compare
    ports:
    - direction: input
      name: In_flag
      size: '1'
    - direction: input
      name: In_keep
      size: mu
    - direction: input
      name: In_sigma
      size: mu
    - direction: output
      name: out_flag
      size: '1'
    - direction: output
      name: out_keep
      size: mu
    - direction: output
      name: out_sigma
      size: mu
    resources:
    - name: T_gates
      type: additive
      value: 4*mu-4
    type: null
  - connections:
    - In_control -> out_control
    - In_target_0 -> out_target_0
    - In_target_1 -> out_target_1
    input_params:
    - X
    name: swap
    ports:
    - direction: input
      name: In_control
      size: '1'
    - direction: input
      name: In_target_0
      size: X
    - direction: input
      name: In_target_1
      size: X
    - direction: output
      name: out_control
      size: null
    - direction: output
      name: out_target_0
      size: null
    - direction: output
      name: out_target_1
      size: null
    resources:
    - name: T_gates
      type: additive
      value: O(log2(X))
    type: null
  connections:
  - In_0 -> usp.in
  - In_1 -> had.in
  - In_2 -> qrom.In_alt
  - In_3 -> qrom.In_keep
  - In_4 -> compare.In_flag
  - compare.out_flag -> swap.In_control
  - compare.out_keep -> temp_2
  - compare.out_sigma -> temp_0
  - had.out -> compare.In_sigma
  - qrom.out_alt -> swap.In_target_1
  - qrom.out_keep -> compare.In_keep
  - qrom.out_l -> swap.In_target_0
  - swap.out_control -> temp_3
  - swap.out_target_0 -> out_0
  - swap.out_target_1 -> temp_1
  - usp.out -> qrom.In_l
  input_params:
  - mu
  - L
  linked_params:
  - source: L
    targets:
    - usp.L
    - qrom.L
    - swap.X
  - source: mu
    targets:
    - qrom.mu
    - compare.mu
  local_variables:
    R: ceiling(log2(L))
  name: alias_sampling
  ports:
  - direction: input
    name: In_0
    size: R
  - direction: input
    name: In_1
    size: mu
  - direction: input
    name: In_2
    size: R
  - direction: input
    name: In_3
    size: mu
  - direction: input
    name: In_4
    size: '1'
  - direction: output
    name: out_0
    size: null
  - direction: output
    name: temp_0
    size: null
  - direction: output
    name: temp_1
    size: null
  - direction: output
    name: temp_2
    size: null
  - direction: output
    name: temp_3
    size: null
  type: null
version: v1
